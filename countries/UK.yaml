# Country pack: United Kingdom. Facts that change (salary floors, fees) are deliberately NOT written here —
# Claude looks them up live from the official links. If a link has moved, search for its name.
code: UK
name: United Kingdom
linkedin_location: United Kingdom
visa:
  route: Skilled Worker visa (employer must hold a sponsor licence)
  route_url: https://www.gov.uk/skilled-worker-visa
  register:
    name: 'Register of licensed sponsors: workers'
    url: https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
    how: 'Run: python scripts/check_sponsor.py UK "Company name". Licence names are legal names (e.g. ''Acme Technologies
      Ltd''), so match loosely. Being on the register means the company CAN sponsor, not that this role will — prefer
      posting wording when it exists.'
  other_routes:
  - Global Talent visa (no employer sponsor needed)
  - Graduate visa
  - High Potential Individual visa
  salary_rule: Sponsored roles must meet a minimum salary and the occupation's going rate. Look up the current figures
    on gov.uk before judging; they change.
  signals:
  - visa sponsorship
  - we sponsor
  - sponsorship available
  - relocation support
  - relocation package
  - help with your visa
  - skilled worker visa
  - certificate of sponsorship
  - CoS
